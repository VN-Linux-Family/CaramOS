[package]
name = "caramos-ui"
version = "2.0.0"
edition = "2021"
authors = ["CaramOS Core Engineering <engineering@caramos.org>"]
description = "Pure-Rust Interactive TUI Installer, Bootloader Theme Engine, and Transactional OTA Updater for CaramOS 2.0 (Debian 13 Trixie)"
license = "GPL-3.0-only"

[dependencies]
# Zero external dependencies by design: deterministic, offline-first build inside chroot/CI.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
