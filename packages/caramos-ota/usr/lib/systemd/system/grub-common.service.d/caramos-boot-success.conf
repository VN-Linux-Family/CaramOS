# CaramOS: GRUB shows its menu, with the recovery mode, after a boot it was not told went well (recordfail).
# Ubuntu tells it as soon as the system is up, even when the screen stays black; CaramOS tells it once someone
# has been on the desktop for a minute (caramos-boot-success.timer), which creates /run/caramos-boot-success.
# Until then this service waits. After a resume from sleep it runs as before.
[Service]
ExecCondition=/usr/bin/test -e /run/caramos-boot-success
