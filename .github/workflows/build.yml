name: Build CaramOS ISO

on:
  push:
    branches: ['*']
    paths-ignore:
      - '*.md'
      - '.github/**'
    tags:
      - 'v*'
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO (${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # GitHub runner có dung lượng giới hạn; ISO remaster cần nhiều disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync wget isolinux syslinux-utils build-essential debhelper

      - name: Cache Mint ISO
        uses: actions/cache@v4
        with:
          path: linuxmint-22.3-cinnamon-64bit.iso
          key: mint-iso-22.3-cinnamon

      - name: Build CaramOS ISO
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Building release from tag ${GITHUB_REF_NAME}"
            sudo -E ./build.sh --release
          else
            echo "Building dev ISO"
            sudo -E ./build.sh
          fi

      - name: Generate checksums
        run: sha256sum CaramOS-*.iso > SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaramOS-ISO
          path: |
            CaramOS-*.iso
            SHA256SUMS
          retention-days: 7
