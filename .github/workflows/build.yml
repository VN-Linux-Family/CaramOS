name: Build CaramOS ISO

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    # A commit that only changes documentation builds no ISO (tags always build: GitHub does not apply path
    # filters to tag pushes).
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO ${{ matrix.edition }} (${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Release builds one edition after the other, so only one of them creates the GitHub Release.
      max-parallel: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 2 }}
      matrix:
        # cinnamon: the main edition; xfce: the light edition for 2 GB computers and school labs.
        edition: [cinnamon, xfce]
    env:
      MINT_EDITION: ${{ matrix.edition }}
      # Cinnamon keeps the SHA256SUMS name that the README and the landing link to.
      CHECKSUMS: ${{ matrix.edition == 'cinnamon' && 'SHA256SUMS' || format('SHA256SUMS-{0}', matrix.edition) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # packages/caramos-app-center is the VN-Linux-Family/CaramOS-app-center repository.
          submodules: true

      - name: Free disk space
        run: |
          # GitHub runner có dung lượng giới hạn; ISO remaster cần nhiều disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync wget isolinux syslinux-utils build-essential debhelper gettext

      - name: Cache Mint ISO
        uses: actions/cache@v5
        with:
          path: linuxmint-22.3-${{ matrix.edition }}-64bit.iso
          key: mint-iso-22.3-${{ matrix.edition }}

      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source scripts/config.sh
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Source version: ${CARAMOS_VERSION}"
          echo "Tag version:    ${TAG_VERSION}"
          if [ "${TAG_VERSION}" != "${CARAMOS_VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match CARAMOS_VERSION=${CARAMOS_VERSION}"
            exit 1
          fi

      - name: Build CaramOS ISO
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Building release from tag ${GITHUB_REF_NAME}"
            sudo -E ./build.sh --release
          else
            echo "Building dev ISO"
            sudo -E ./build.sh
          fi

      - name: Generate checksums
        run: sha256sum CaramOS-*.iso > "${CHECKSUMS}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: CaramOS-ISO-${{ matrix.edition }}
          path: |
            CaramOS-*.iso
            ${{ env.CHECKSUMS }}
          retention-days: 7

      # Cloudflare R2 (download.caramos.vietnamlinuxfamily.net), where the landing page's download buttons point;
      # SourceForge below stays as the backup link. Only the newest release is kept on R2 (r2-upload.yml does the
      # same for a release that is already out).
      - name: Upload ISO to R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_DEFAULT_REGION: auto
          EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::R2 secrets are not set: the ISO is only on SourceForge."
            exit 0
          fi
          ISO_FILE="$(ls CaramOS-*.iso | head -n 1)"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${ISO_FILE}" "s3://caramos-iso/${ISO_FILE}" --endpoint-url "${endpoint}" --only-show-errors \
            --content-type application/x-iso9660-image --content-disposition "attachment; filename=${ISO_FILE}"
          aws s3 cp "${CHECKSUMS}" "s3://caramos-iso/${CHECKSUMS}" --endpoint-url "${endpoint}" --only-show-errors \
            --content-type "text/plain; charset=utf-8"
          aws s3api list-objects-v2 --bucket caramos-iso --endpoint-url "${endpoint}" \
              --query 'Contents[].Key' --output text | tr '\t' '\n' \
            | { grep -E "^CaramOS-.*-${EDITION}-amd64\.iso$" || true; } | { grep -vxF "${ISO_FILE}" || true; } \
            | while read -r old; do
                echo "Deleting ${old}"
                aws s3 rm "s3://caramos-iso/${old}" --endpoint-url "${endpoint}" --only-show-errors
              done

      - name: Upload ISO to SourceForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          ISO_FILE="$(ls CaramOS-*.iso | head -n 1)"
          ISO_BASENAME="$(basename "${ISO_FILE}")"

          if [ -z "${SOURCEFORGE_USERNAME}" ] || [ -z "${SOURCEFORGE_PROJECT}" ] || [ -z "${SOURCEFORGE_SSH_KEY}" ]; then
            echo "::error::GitHub Release assets are limited to about 2 GiB per file. Configure SOURCEFORGE_USERNAME, SOURCEFORGE_PROJECT, and SOURCEFORGE_SSH_KEY secrets to publish the ISO as one downloadable file on SourceForge."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SOURCEFORGE_SSH_KEY}" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          RELEASE_DIR="/home/frs/project/${SOURCEFORGE_PROJECT}/${GITHUB_REF_NAME}"
          cat > upload-release.sftp <<EOF
          -mkdir ${RELEASE_DIR}
          cd ${RELEASE_DIR}
          put ${ISO_FILE}
          put ${CHECKSUMS}
          EOF

          sftp -i ~/.ssh/sourceforge \
            -o IdentitiesOnly=yes \
            -b upload-release.sftp \
            "${SOURCEFORGE_USERNAME}@frs.sourceforge.net"

          DOWNLOAD_URL="https://sourceforge.net/projects/${SOURCEFORGE_PROJECT}/files/${GITHUB_REF_NAME}/${ISO_BASENAME}/download"
          CHECKSUM_URL="https://sourceforge.net/projects/${SOURCEFORGE_PROJECT}/files/${GITHUB_REF_NAME}/${CHECKSUMS}/download"
          python3 - <<PY
          from pathlib import Path
          import textwrap

          github_ref_name = "${GITHUB_REF_NAME}"
          iso_basename = "${ISO_BASENAME}"
          download_url = "${DOWNLOAD_URL}"
          checksum_url = "${CHECKSUM_URL}"
          sourceforge_project = "${SOURCEFORGE_PROJECT}"
          edition = "${MINT_EDITION}".capitalize()
          checksums = "${CHECKSUMS}"

          release_body = f"""
          ## Download CaramOS {github_ref_name} {edition}

          > GitHub Release cannot host the ISO directly because release assets have a
          > per-file size limit. The ISO is hosted as one complete file on SourceForge.

          <p align="center">
            <a href="{download_url}">
              <img src="https://img.shields.io/badge/Download-CaramOS%20ISO-ff6b00?style=for-the-badge&logo=linux&logoColor=white" alt="Download CaramOS ISO">
            </a>
          </p>

          - **ISO:** [{iso_basename}]({download_url})
          - **{checksums}:** [{checksums}]({checksum_url})
          - **SourceForge folder:** https://sourceforge.net/projects/{sourceforge_project}/files/{github_ref_name}/

          ### Verify the ISO

          ```bash
          sha256sum -c {checksums}
          ```
          """

          Path("RELEASE_DOWNLOADS.md").write_text(textwrap.dedent(release_body).strip() + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.CHECKSUMS }}
          body_path: RELEASE_DOWNLOADS.md
          append_body: true
          generate_release_notes: true
